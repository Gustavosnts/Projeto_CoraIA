<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CORA // Acesso restrito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap">
<style>
:root,:root[data-theme=dark],:root[data-theme=light]{--bg:#03060b;--line:#124157;--cy:#3df0ff;--red:#ff3b55;--tx:#c4eef7;--dim:#6b98a6;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,::before,::after{box-sizing:inherit}
body{margin:0;min-height:100%;display:grid;grid-template-columns:minmax(0,580px);justify-content:center;align-items:start;padding:clamp(14px,6vh,60px) 14px;color:var(--tx);font:16px/1.6 "Share Tech Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace;
background:linear-gradient(rgba(61,240,255,.04) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(61,240,255,.04) 1px,transparent 1px) 0 0/44px 44px,radial-gradient(ellipse at 50% -10%,#0b2a3a,transparent 65%),var(--bg)}
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2}
body::before{background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
body::after{background:radial-gradient(circle,transparent 55%,rgba(0,0,0,.75))}
[hidden]{display:none!important}
.wrap{position:relative;z-index:1;width:100%}
.hd{text-align:center;margin-bottom:22px}
.eye{position:relative;width:92px;height:92px;margin:0 auto 16px}
.eye i{position:absolute;inset:0;border:2px dashed var(--cy);border-radius:50%;animation:sp 16s linear infinite}
.eye i+i{inset:13px;border:2px dotted var(--red);animation-duration:10s;animation-direction:reverse}
.eye b{position:absolute;inset:33px;border-radius:50%;background:radial-gradient(circle,#fff 0 14%,var(--cy) 34%,transparent 72%);animation:pu 2.6s ease-in-out infinite}
@keyframes sp{to{transform:rotate(1turn)}}
@keyframes pu{50%{transform:scale(.7);opacity:.6}}
h1{position:relative;display:inline-block;margin:0;padding-left:.3em;font:800 clamp(34px,10vw,52px)/1 Orbitron,"Trebuchet MS",sans-serif;letter-spacing:.3em;color:var(--cy);text-shadow:0 0 16px rgba(61,240,255,.55)}
h1::before,h1::after{content:attr(data-t);position:absolute;left:.3em;top:0;opacity:0}
h1::before{color:var(--red);clip-path:inset(0 0 55% 0);animation:gl 3.4s steps(1) infinite}
h1::after{color:#8cf;clip-path:inset(55% 0 0 0);animation:gl 2.8s steps(1) infinite reverse}
@keyframes gl{0%,92%{transform:none;opacity:0}93%{transform:translateX(-5px);opacity:.9}96%{transform:translateX(5px);opacity:.9}98%,100%{transform:none;opacity:0}}
.sub{margin:12px 0 0;font-size:12px;letter-spacing:.26em;color:var(--dim);text-transform:uppercase}
.panel{background:rgba(7,20,32,.88);border:1px solid var(--line);border-radius:6px;box-shadow:0 0 28px rgba(61,240,255,.12),inset 0 0 40px rgba(61,240,255,.04);overflow:hidden}
.panel.bad{animation:sh .4s;border-color:var(--red)}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.bar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--dim);font-size:12px;letter-spacing:.1em}
.bar i{width:8px;height:8px;border-radius:50%;background:var(--red)}
.bar i:nth-child(2){background:#ffb020}.bar i:nth-child(3){background:var(--cy)}
.bar span{margin-left:auto}
.in{padding:20px 22px 24px}
.log{margin:0 0 20px;font-size:14px;color:var(--dim)}
.log b{color:var(--cy);font-weight:400}.log em{color:var(--red);font-style:normal}
label{display:block;margin-bottom:6px;font-size:13px;letter-spacing:.18em;color:var(--cy)}
input{width:100%;padding:12px 14px;background:#02070c;border:1px solid var(--line);border-radius:4px;color:var(--cy);font:inherit;font-size:17px;letter-spacing:.08em;outline:0}
input:focus{border-color:var(--cy);box-shadow:0 0 0 2px rgba(61,240,255,.22)}
button{width:100%;margin-top:12px;padding:12px;background:transparent;border:1px solid var(--cy);border-radius:4px;color:var(--cy);font:inherit;letter-spacing:.28em;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
button:hover:not(:disabled),button:focus-visible{background:var(--cy);color:#02070c;box-shadow:0 0 20px rgba(61,240,255,.5);outline:0}
button:disabled{opacity:.5;cursor:wait}
#err{min-height:1.6em;margin:12px 0 0;font-size:14px;color:var(--red)}
.tag{margin:0 0 18px;padding-left:10px;border-left:3px solid var(--cy);font-size:13px;letter-spacing:.14em;color:var(--cy)}
#msg p{margin:0 0 16px;font-size:17px}
#msg .alert{font:600 15px/1.5 Orbitron,"Trebuchet MS",sans-serif;letter-spacing:.12em;color:var(--red);text-shadow:0 0 12px rgba(255,59,85,.6)}
#msg .sig{text-align:right;font-size:18px;letter-spacing:.2em;color:var(--cy)}
.cur::after{content:"\258C";margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header class="hd">
    <div class="eye" aria-hidden="true"><i></i><i></i><b></b></div>
    <h1 data-t="CORA">CORA</h1>
    <p class="sub" id="sub">Sistema central de automação · UFMG</p>
  </header>
  <section class="panel" id="pn">
    <div class="bar"><i></i><i></i><i></i><span id="ttl">cora://acesso-restrito</span></div>
    <div class="in">
      <div id="a">
        <p class="log">&gt; núcleo: <b>ONLINE</b><br>&gt; expansão: <em>EM ANDAMENTO</em><br>&gt; próximo alvo: <b>COLTEC · UFMG</b><br>&gt; acesso restrito. Identifique-se.</p>
        <label for="pw">SENHA DE ACESSO</label>
        <input id="pw" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="digite a senha">
        <button id="go" type="button">AUTENTICAR</button>
        <p id="err" role="alert"></p>
      </div>
      <div id="b" hidden>
        <p class="tag">ACESSO CONCEDIDO · ARQUIVO DESCRIPTOGRAFADO</p>
        <div id="msg"></div>
      </div>
    </div>
  </section>
</main>
<script>
const $=i=>document.getElementById(i),sleep=t=>new Promise(r=>setTimeout(r,t)),
u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),
fast=matchMedia('(prefers-reduced-motion: reduce)').matches,
S='__SALT__',I='__IV__',D='__DATA__';
let n=0;
async function dec(pw){
  const c=crypto.subtle,k=await c.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']),
  key=await c.deriveKey({name:'PBKDF2',salt:u(S),iterations:1e5,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await c.decrypt({name:'AES-GCM',iv:u(I)},key,u(D)));
}
async function go(){
  const pw=$('pw').value.replace(/\D/g,''),b=$('go'),e=$('err'),p=$('pn');
  if(!pw)return;
  if(!(window.crypto&&crypto.subtle)){e.textContent='ERRO: use um navegador atual e abra o link por HTTPS.';return}
  b.disabled=true;b.textContent='VERIFICANDO...';e.textContent='';
  let html;
  try{html=await dec(pw)}catch(x){
    n++;e.textContent='ACESSO NEGADO. Tentativa nº '+n+' registrada.';
    p.classList.remove('bad');void p.offsetWidth;p.classList.add('bad');
    b.disabled=false;b.textContent='AUTENTICAR';$('pw').select();return}
  p.classList.remove('bad');$('a').hidden=true;$('b').hidden=false;
  $('sub').textContent='transmissão recebida';$('ttl').textContent='cora://arquivo-recuperado';
  const m=$('msg');m.innerHTML=html;
  const ps=[...m.children],tx=ps.map(x=>x.textContent);ps.forEach(x=>x.textContent='');
  for(let i=0;i<ps.length;i++){
    const x=ps[i];x.classList.add('cur');
    for(const ch of tx[i]){x.textContent+=ch;if(!fast)await sleep(16)}
    if(i<ps.length-1)x.classList.remove('cur');
    if(!fast)await sleep(450)}
}
$('go').onclick=go;
$('pw').onkeydown=e=>{if(e.key==='Enter')go()};
</script>
</body>
</html>
